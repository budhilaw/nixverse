# One age recipient per machine that must decrypt something.
#   budhilaw       — personal key (1Password) on the Mac; encrypts everything
#   homelab-lenovo — derived from the server's SSH host key:
#                    ssh-keyscan -t ed25519 100.64.0.1 | ssh-to-age
keys:
  - &budhilaw age1nee0l03vzmqzg7s4k4u3pzjypwcd8nvsqzyhjge0h4s6pr6z897su3flls
  - &homelab-lenovo age1p0v86rm8hmzyl6wf69hjydm80sl7jpgs7dpwtcuzsgyjjde5yqls7pw3v8

creation_rules:
  - path_regex: secrets/homelab-lenovo\.yaml$
    key_groups:
      - age:
          - *budhilaw
          - *homelab-lenovo
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *budhilaw
